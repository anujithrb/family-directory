version: '3.9'

# ============================================================
# Docker Compose — Supabase-hosted PostgreSQL variant
#
# Replaces the local postgres container with Supabase's managed
# PostgreSQL free-tier database.
#
# Required .env variables (see .env.example for format):
#   DATABASE_URL  — Supabase transaction-mode pooler URL
#   DIRECT_URL    — Supabase direct connection URL (for migrations)
#   REDIS_PASSWORD, JWT_SECRET, JWT_REFRESH_SECRET, CORS_ORIGIN
#
# Usage:
#   1. Copy .env.example to .env and fill in your Supabase URLs.
#   2. Build images:       make build
#   3. Start the stack:    make supabase-up
#   4. Run migrations:     make supabase-migrate
#   5. (Optional) Seed:    make supabase-seed
# ============================================================

services:
  redis:
    image: redis:7-alpine
    container_name: family-directory-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - family-network

  backend:
    image: family-directory-backend:latest
    container_name: family-directory-backend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRES_IN=15m
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=${CORS_ORIGIN}
      - UPLOAD_DIR=/app/uploads
      - MAX_FILE_SIZE=5242880
      - RATE_LIMIT_WINDOW_MS=900000
      - RATE_LIMIT_MAX=5
      - LOG_LEVEL=info
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - family-network

  frontend:
    image: family-directory-frontend:latest
    container_name: family-directory-frontend
    volumes:
      - frontend_dist:/usr/share/nginx/html
    deploy:
      resources:
        limits:
          memory: 128m
    restart: unless-stopped
    networks:
      - family-network

  nginx:
    image: nginx:alpine
    container_name: family-directory-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks:
      - family-network

volumes:
  redis_data:
  backend_uploads:
  backend_logs:
  frontend_dist:

networks:
  family-network:
    driver: bridge
